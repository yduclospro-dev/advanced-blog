services:
  postgres:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: testdb
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d testdb -h localhost"]
      interval: 2s
      timeout: 2s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  test-runner:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      - ./.env.test:/app/.env.test
    environment:
      DOTENV_CONFIG_PATH: "/app/.env.test"
      TEST_IN_DOCKER: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "
        npm install &&
        npm run ci:wait:db &&
        npm run ci:migrate &&
        npm run ci:test
      "

